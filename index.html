<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111216" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="计算器" />
    <title>计算器</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="计算器">
      <section class="display-panel" aria-label="计算结果和历史记录">
        <header class="app-header">
          <h1>计算器</h1>
        </header>

        <div class="history-toolbar">
          <span class="history-title">计算历史</span>
          <button class="text-button" type="button" disabled>清空历史</button>
        </div>

        <div class="history-scroll" tabindex="0" aria-label="计算历史，可上下滑动">
          <div class="history-list" aria-live="polite"></div>
        </div>

        <div class="current-calculation" aria-live="polite" aria-atomic="true">
          <div class="expression">准备计算</div>
          <output class="result" aria-label="当前结果">0</output>
        </div>
      </section>

      <section class="controls" aria-label="计算器按键">
        <div class="utility-row" role="group" aria-label="辅助功能">
          <button type="button" class="clear-key" data-action="clear">AC</button>
          <button type="button" class="utility-key" data-action="toggle-sign" aria-label="切换正负号">+/−</button>
          <button type="button" class="utility-key" data-action="percent" aria-label="百分比">%</button>
          <button type="button" class="backspace-key" data-action="backspace" aria-label="回删一位">⌫</button>
        </div>

        <div class="keypad">
          <button type="button" class="number-key" data-value="7">7</button>
          <button type="button" class="number-key" data-value="8">8</button>
          <button type="button" class="number-key" data-value="9">9</button>
          <button type="button" class="operator-key" data-operation="divide" aria-label="除">÷</button>

          <button type="button" class="number-key" data-value="4">4</button>
          <button type="button" class="number-key" data-value="5">5</button>
          <button type="button" class="number-key" data-value="6">6</button>
          <button type="button" class="operator-key" data-operation="multiply" aria-label="乘">×</button>

          <button type="button" class="number-key" data-value="1">1</button>
          <button type="button" class="number-key" data-value="2">2</button>
          <button type="button" class="number-key" data-value="3">3</button>
          <button type="button" class="operator-key" data-operation="subtract" aria-label="减">−</button>

          <button type="button" class="number-key zero-key" data-value="0">0</button>
          <button type="button" class="number-key" data-value="." aria-label="小数点">.</button>
          <button type="button" class="operator-key" data-operation="add" aria-label="加">+</button>

          <button type="button" class="equals-key" data-action="equals" aria-label="计算结果">=</button>
        </div>
      </section>
    </main>

    <div class="storage-notice" role="status" aria-live="polite" hidden></div>

    <dialog class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
      <form method="dialog">
        <h2 id="confirm-title">确认删除</h2>
        <p id="confirm-description"></p>
        <div class="dialog-actions">
          <button class="dialog-button dialog-cancel" type="submit" value="cancel">取消</button>
          <button class="dialog-button dialog-confirm" type="submit" value="confirm">删除</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
